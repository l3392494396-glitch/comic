name: Daily comic check-in

"on":
  schedule:
    # GitHub cron uses UTC. 16:17 UTC = 00:17 Asia/Shanghai.
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: comic-daily-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run daily check-in
        env:
          JM_USERNAME: ${{ secrets.JM_USERNAME }}
          JM_PASSWORD: ${{ secrets.JM_PASSWORD }}
          JM_COOKIE: ${{ secrets.JM_COOKIE }}
          JM_BASE_URL: ${{ secrets.JM_BASE_URL }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python checkin.py

      - name: Auto Keepalive (Prevent 60-day GitHub sleep)
        uses: gautamkrishnar/keepalive-workflow@v2
        with:
          committer_username: github-actions[bot]
          committer_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "chore(ops): monthly automated keepalive [skip ci]"
