name: Daily comic check-in

"on":
  schedule:
    # GitHub cron uses UTC. 01:00 UTC = 09:00 Asia/Shanghai.
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: comic-daily-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Refresh login state
        env:
          JM_USERNAME: ${{ secrets.JM_USERNAME }}
          JM_PASSWORD: ${{ secrets.JM_PASSWORD }}
          JM_COOKIE: ${{ secrets.JM_COOKIE }}
        run: python refresh_login.py

      - name: Run daily check-in
        env:
          JM_USERNAME: ${{ secrets.JM_USERNAME }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python checkin.py
