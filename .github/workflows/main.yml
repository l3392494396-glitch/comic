name: Daily comic check-in

"on":
  schedule:
    # GitHub cron uses UTC. 16:17 UTC = 00:17 Asia/Shanghai.
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: comic-daily-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run daily check-in
        env:
          JM_USERNAME: ${{ secrets.JM_USERNAME }}
          JM_PASSWORD: ${{ secrets.JM_PASSWORD }}
          JM_COOKIE: ${{ secrets.JM_COOKIE }}
          JM_BASE_URL: ${{ secrets.JM_BASE_URL }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python checkin.py

      - name: Monthly Keepalive (Prevent 60-day GitHub sleep)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          LAST_COMMIT_TIME=$(git log -1 --format=%ct)
          CURRENT_TIME=$(date +%s)
          DAYS_SINCE=$(( (CURRENT_TIME - LAST_COMMIT_TIME) / 86400 ))
          echo "距上次提交已过去: ${DAYS_SINCE} 天"
          
          if [ ${DAYS_SINCE} -ge 40 ] || [ $(date +%d) -eq 01 ] || [ ! -f ".keepalive" ]; then
            echo "触发自动保活机制，生成月度活跃标记..."
            date -u +"%Y-%m-%d %H:%M:%S UTC" > .keepalive
            git add .keepalive
          fi
          
          if ! git diff --cached --quiet; then
            git commit -m "chore(ops): monthly automated keepalive [skip ci]"
            git push origin main
            echo "已成功提交月度保活记录，GitHub 60天定时任务倒计时已重置！"
          else
            echo "未达保活阈值，跳过提交。"
          fi
